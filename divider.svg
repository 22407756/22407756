<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF00C8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF00C8"/>
      <stop offset="0.5" stop-color="#00F0FF"/>
      <stop offset="0.8" stop-color="#FCEE0A"/>
      <stop offset="1" stop-color="#FCEE0A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="14" width="1200" height="3" rx="1.5" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="0" cy="15.5" r="6" fill="#FFFFFF" filter="url(#glow)">
    <animate attributeName="cx" values="0;1200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1200" cy="15.5" r="4" fill="#FF00C8" filter="url(#glow)">
    <animate attributeName="cx" values="1200;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
