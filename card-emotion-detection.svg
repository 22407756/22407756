<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1F0640"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF00C8"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00F0FF" stroke-opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="600" height="240" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect x="0" y="-30" width="600" height="300" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" from="0 0" to="0 30" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="3" fill="#00F0FF" opacity="0.25"><animate attributeName="y" values="-5;245" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="5" fill="url(#bar)"/>
    <circle cx="36" cy="38" r="6" fill="#00F0FF" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="52" y="43" font-family="'Courier New', monospace" font-size="14" fill="#00F0FF" letter-spacing="2">COMPLETED</text>
    <text x="30" y="92" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#FFFFFF" filter="url(#glow)">EMOTION DETECTION APP</text>
    <text x="30" y="126" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">Detects emotions in text: joy, anger,</text>
    <text x="30" y="148" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">fear, sadness and disgust.</text>
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="14">
      <rect x="30" y="178" width="77" height="30" rx="6" fill="none" stroke="#FF00C8" stroke-width="2"/><text x="68.5" y="198" text-anchor="middle" fill="#FF00C8">Python</text>
      <rect x="119" y="178" width="69" height="30" rx="6" fill="none" stroke="#FCEE0A" stroke-width="2"/><text x="153.5" y="198" text-anchor="middle" fill="#FCEE0A">Flask</text>
      <rect x="200" y="178" width="112" height="30" rx="6" fill="none" stroke="#00F0FF" stroke-width="2"/><text x="256.0" y="198" text-anchor="middle" fill="#00F0FF">Watson NLP</text>
    </g>
    <rect x="388" y="58" width="196" height="42" rx="10" fill="none" stroke="#00F0FF" stroke-width="2"/><text x="402" y="84" font-family="'Courier New', monospace" font-size="13" fill="#FFFFFF">"I am so happy today!"</text>
    <text x="388" y="127" font-family="'Courier New', monospace" font-size="12" fill="#FCEE0A">joy</text><rect x="458" y="118" width="105" height="10" rx="5" fill="#2A1B54"/><rect x="458" y="118" height="10" rx="5" fill="#FCEE0A"><animate attributeName="width" values="0;101;101;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
    <text x="388" y="147" font-family="'Courier New', monospace" font-size="12" fill="#FF00C8">anger</text><rect x="458" y="138" width="105" height="10" rx="5" fill="#2A1B54"/><rect x="458" y="138" height="10" rx="5" fill="#FF00C8"><animate attributeName="width" values="0;4;4;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
    <text x="388" y="167" font-family="'Courier New', monospace" font-size="12" fill="#00F0FF">fear</text><rect x="458" y="158" width="105" height="10" rx="5" fill="#2A1B54"/><rect x="458" y="158" height="10" rx="5" fill="#00F0FF"><animate attributeName="width" values="0;4;4;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
    <text x="388" y="187" font-family="'Courier New', monospace" font-size="12" fill="#FF00C8">sadness</text><rect x="458" y="178" width="105" height="10" rx="5" fill="#2A1B54"/><rect x="458" y="178" height="10" rx="5" fill="#FF00C8"><animate attributeName="width" values="0;4;4;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
    <text x="388" y="207" font-family="'Courier New', monospace" font-size="12" fill="#00F0FF">disgust</text><rect x="458" y="198" width="105" height="10" rx="5" fill="#2A1B54"/><rect x="458" y="198" height="10" rx="5" fill="#00F0FF"><animate attributeName="width" values="0;4;4;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
    <text x="574" y="127" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">97%</text>
  </g>
  <rect x="2" y="2" width="596" height="236" rx="14" fill="none" stroke="#FF00C8" stroke-width="2"><animate attributeName="stroke" values="#FF00C8;#00F0FF;#FF00C8" dur="4s" repeatCount="indefinite"/></rect>
</svg>
