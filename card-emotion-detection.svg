<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1F0640"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF00C8"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00F0FF" stroke-opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="600" height="240" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect x="0" y="-30" width="600" height="300" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" from="0 0" to="0 30" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="3" fill="#00F0FF" opacity="0.25"><animate attributeName="y" values="-5;245" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="5" fill="url(#bar)"/>
    <circle cx="36" cy="38" r="6" fill="#00F0FF" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="52" y="43" font-family="'Courier New', monospace" font-size="14" fill="#00F0FF" letter-spacing="2">COMPLETED</text>
    <text x="30" y="92" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#FFFFFF" filter="url(#glow)">EMOTION DETECTION APP</text>
    <text x="30" y="126" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">Detects human emotions from faces</text>
    <text x="30" y="148" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">using computer vision.</text>
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="14">
      <rect x="30" y="178" width="77" height="30" rx="6" fill="none" stroke="#FF00C8" stroke-width="2"/><text x="68.5" y="198" text-anchor="middle" fill="#FF00C8">Python</text>
      <rect x="119" y="178" width="77" height="30" rx="6" fill="none" stroke="#FCEE0A" stroke-width="2"/><text x="157.5" y="198" text-anchor="middle" fill="#FCEE0A">OpenCV</text>
      <rect x="208" y="178" width="137" height="30" rx="6" fill="none" stroke="#00F0FF" stroke-width="2"/><text x="276.5" y="198" text-anchor="middle" fill="#00F0FF">Deep Learning</text>
    </g>
    <circle cx="480" cy="120" r="48" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow)"/>
    <circle cx="463" cy="108" r="5" fill="#FFFFFF"/><circle cx="497" cy="108" r="5" fill="#FFFFFF"/>
    <path d="M458 132 Q480 154 502 132" fill="none" stroke="#FF00C8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"><animate attributeName="d" values="M458 132 Q480 154 502 132;M458 140 Q480 140 502 140;M458 132 Q480 154 502 132" dur="3s" repeatCount="indefinite"/></path>
    <g fill="none" stroke="#FCEE0A" stroke-width="3" stroke-linecap="round"><path d="M418 80V62H436"/><path d="M542 80V62H524"/><path d="M418 160V178H436"/><path d="M542 160V178H524"/></g>
    <rect x="420" y="62" width="120" height="3" fill="#FF00C8" filter="url(#glow)"><animate attributeName="y" values="62;176;62" dur="2.5s" repeatCount="indefinite"/></rect>
    <text x="480" y="204" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#FCEE0A">EMOTION: HAPPY<animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.5;0.6;1" dur="3s" repeatCount="indefinite"/></text>
  </g>
  <rect x="2" y="2" width="596" height="236" rx="14" fill="none" stroke="#FF00C8" stroke-width="2"><animate attributeName="stroke" values="#FF00C8;#00F0FF;#FF00C8" dur="4s" repeatCount="indefinite"/></rect>
</svg>
