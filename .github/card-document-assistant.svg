<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1F0640"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF00C8"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00F0FF" stroke-opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="600" height="240" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect x="0" y="-30" width="600" height="300" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" from="0 0" to="0 30" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="3" fill="#00F0FF" opacity="0.25"><animate attributeName="y" values="-5;245" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="600" height="5" fill="url(#bar)"/>
    <circle cx="36" cy="38" r="6" fill="#00FF9C" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="52" y="43" font-family="'Courier New', monospace" font-size="14" fill="#00FF9C" letter-spacing="2">IN DEVELOPMENT</text>
    <text x="30" y="92" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#FFFFFF" filter="url(#glow)">AI DOCUMENT ASSISTANT</text>
    <text x="30" y="126" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">AI chatbot that answers questions</text>
    <text x="30" y="148" font-family="'Courier New', monospace" font-size="16" fill="#00F0FF">based on your own documents.</text>
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="14">
      <rect x="30" y="178" width="77" height="30" rx="6" fill="none" stroke="#FF00C8" stroke-width="2"/><text x="68.5" y="198" text-anchor="middle" fill="#FF00C8">Python</text>
      <rect x="119" y="178" width="51" height="30" rx="6" fill="none" stroke="#FCEE0A" stroke-width="2"/><text x="144.5" y="198" text-anchor="middle" fill="#FCEE0A">NLP</text>
      <rect x="182" y="178" width="51" height="30" rx="6" fill="none" stroke="#00F0FF" stroke-width="2"/><text x="207.5" y="198" text-anchor="middle" fill="#00F0FF">LLM</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.9;1" dur="5s" begin="0s" repeatCount="indefinite"/><rect x="395" y="62" width="160" height="38" rx="10" fill="none" stroke="#FF00C8" stroke-width="2" filter="url(#glow)"/><rect x="409" y="73" width="110" height="5" rx="2" fill="#FF00C8"/><rect x="409" y="84" width="70" height="5" rx="2" fill="#FF00C8"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.9;1" dur="5s" begin="1s" repeatCount="indefinite"/><rect x="425" y="112" width="160" height="38" rx="10" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/><rect x="439" y="123" width="110" height="5" rx="2" fill="#00F0FF"/><rect x="439" y="134" width="70" height="5" rx="2" fill="#00F0FF"/></g>
    <circle cx="440" cy="190" r="4" fill="#FCEE0A"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="456" cy="190" r="4" fill="#FCEE0A"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="472" cy="190" r="4" fill="#FCEE0A"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="2" y="2" width="596" height="236" rx="14" fill="none" stroke="#FF00C8" stroke-width="2"><animate attributeName="stroke" values="#FF00C8;#00F0FF;#FF00C8" dur="4s" repeatCount="indefinite"/></rect>
</svg>
