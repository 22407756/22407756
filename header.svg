<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0221"/>
      <stop offset="1" stop-color="#1F0640"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF00C8" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF00C8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <clipPath id="typing">
      <rect x="230" y="188" height="40" width="0">
        <animate attributeName="width" values="0;740;740;0" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect x="0" y="-40" width="1200" height="400" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="200" width="1200" height="120" fill="url(#horizon)"/>

    <!-- scan line -->
    <rect x="0" y="0" width="1200" height="4" fill="#00F0FF" opacity="0.25">
      <animate attributeName="y" values="-10;330" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- glitch name -->
    <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="78" text-anchor="middle">
      <text x="600" y="140" fill="#FF00C8" opacity="0.85">
        <animate attributeName="x" values="600;605;595;600;600;609;600;600" keyTimes="0;0.08;0.16;0.24;0.7;0.75;0.8;1" dur="3s" repeatCount="indefinite"/>
        SARA OUSSOUSSOU
      </text>
      <text x="600" y="140" fill="#00F0FF" opacity="0.85">
        <animate attributeName="x" values="600;595;605;600;600;591;600;600" keyTimes="0;0.08;0.16;0.24;0.7;0.75;0.8;1" dur="3s" repeatCount="indefinite"/>
        SARA OUSSOUSSOU
      </text>
      <text x="600" y="140" fill="#FFFFFF" filter="url(#glow)">SARA OUSSOUSSOU</text>
    </g>

    <!-- typed subtitle -->
    <g clip-path="url(#typing)">
      <text x="230" y="217" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="22" fill="#FCEE0A" textLength="740" lengthAdjust="spacingAndGlyphs">&gt; AI ENGINEERING STUDENT // DEVELOPER // DATA ENTHUSIAST</text>
    </g>
    <rect x="978" y="197" width="12" height="26" fill="#FCEE0A">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="600" y="270" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" fill="#FF00C8" letter-spacing="3">
      [ MACHINE LEARNING • COMPUTER VISION • NLP ]
      <animate attributeName="opacity" values="1;0.45;1;1;0.6;1" keyTimes="0;0.1;0.2;0.7;0.8;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- neon frame -->
  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="#00F0FF" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#FF00C8" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M20 60V22H58"/>
    <path d="M1180 60V22H1142"/>
    <path d="M20 260V298H58"/>
    <path d="M1180 260V298H1142"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </g>
</svg>
